<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Materno · Iniciar sesión</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(160deg,#0b3c5d,#1a7fb8);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .caja{background:#fff;border-radius:16px;padding:44px 36px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .logo{display:flex;justify-content:center;margin-bottom:16px}
  h1{font-size:23px;color:#0b3c5d;margin-bottom:6px}
  .sub{color:#6b8299;font-size:13.5px;margin-bottom:26px;line-height:1.5}
  .campo{text-align:left;margin-bottom:14px}
  .campo label{display:block;font-size:12.5px;color:#0b3c5d;font-weight:600;margin-bottom:5px}
  .campo input{width:100%;padding:11px 12px;border:1.5px solid #d5dee6;border-radius:9px;font-size:14.5px;
    color:#203864;background:#fbfdfe;outline:none;transition:border-color .15s}
  .campo input:focus{border-color:#1a7fb8;background:#fff}
  button.ingresar{width:100%;padding:12px;border:0;border-radius:9px;background:#1a7fb8;color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  button.ingresar:hover{background:#0b3c5d}
  button.ingresar:disabled{background:#9dc2da;cursor:wait}
  .registro{display:none}
  .registro.visible{display:block}
  button.vinculo{background:none;border:0;color:#1a7fb8;font-size:13px;cursor:pointer;margin-top:16px;text-decoration:underline;font-family:inherit}
  button.vinculo:hover{color:#0b3c5d}
  #msg{margin-top:16px;font-size:13px;color:#c0392b;min-height:18px;line-height:1.45}
  .pie{margin-top:22px;font-size:11.5px;color:#95a5b5;line-height:1.5}
  .cargando{color:#6b8299;font-size:13.5px}
</style>
</head>
<body>
<div class="caja">
  <div class="logo"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1a7fb8" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="#1a7fb8" stroke="none"/><path d="M12 12 L19.2 7.2"/></svg></div>
  <h1>Radar Materno</h1>
  <p class="sub">Seguimiento de unidades de análisis materno-perinales · Villavicencio</p>

  <form id="form" autocomplete="on">
    <div class="campo registro" id="campoNombre">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" placeholder="Tu nombre (así aparecerá en los casos)"
             autocomplete="name" autocapitalize="words" spellcheck="false">
    </div>
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="username" type="text" placeholder="Correo o nombre de usuario"
             autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" name="password" type="password" placeholder="••••••••"
             autocomplete="current-password" required>
    </div>
    <div class="campo registro" id="campoConfirmar">
      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" type="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="ingresar" id="btn" type="submit">Iniciar sesión</button>
  </form>
  <button class="vinculo" id="alternar" type="button">¿No tienes cuenta? Regístrate</button>

  <div id="msg" role="alert"></div>
  <p class="pie">Acceso reservado a los usuarios registrados por el administrador.</p>
</div>

<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbx6oAE7tN0WDvDHeF_wtaF6knIiZhUqb1ciEuVDrFp7wuCYTlpwQULLP8R6xQ1fSUDY/exec';

function msg(t, err) {
  var m = document.getElementById('msg');
  m.textContent = t || '';
  m.style.color = err ? '#c0392b' : '#189a5e';
}

var modoRegistro = false;

function setModo(registro) {
  modoRegistro = registro;
  document.getElementById('campoNombre').classList.toggle('visible', registro);
  document.getElementById('campoConfirmar').classList.toggle('visible', registro);
  document.getElementById('btn').textContent = registro ? 'Crear cuenta' : 'Iniciar sesión';
  document.getElementById('alternar').textContent =
    registro ? 'Ya tengo cuenta · Iniciar sesión' : '¿No tienes cuenta? Regístrate';
  msg('');
}

document.getElementById('alternar').addEventListener('click', function () {
  setModo(!modoRegistro);
});

document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var usuario = document.getElementById('usuario').value.trim();
  var clave = document.getElementById('clave').value;
  var btn = document.getElementById('btn');

  if (!usuario || !clave) { msg('Escribe tu usuario y tu contraseña.', true); return; }

  var payload;
  if (modoRegistro) {
    var nombre = document.getElementById('nombre').value.trim();
    var confirmar = document.getElementById('confirmar').value;
    if (!nombre) { msg('Escribe tu nombre completo.', true); return; }
    if (clave.length < 6) { msg('La contraseña debe tener al menos 6 caracteres.', true); return; }
    if (clave !== confirmar) { msg('Las contraseñas no coinciden.', true); return; }
    payload = { accion: 'registro', datos: { nombre: nombre, email: usuario, clave: clave } };
  } else {
    payload = { accion: 'login', usuario: usuario, clave: clave };
  }

  btn.disabled = true;
  btn.textContent = 'Verificando…';
  msg('');

  fetch(APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      btn.disabled = false;
      btn.textContent = modoRegistro ? 'Crear cuenta' : 'Iniciar sesión';
      if (r && r.ok) {
        if (modoRegistro) {
          msg(r.mensaje || 'Cuenta creada. El administrador debe activarla.');
          setModo(false);
          document.getElementById('clave').value = '';
        } else {
          msg('¡Bienvenido ' + (r.nombre || '') + '! Entrando…');
          window.location.href = 'app.html?ses=' + encodeURIComponent(r.token);
        }
      } else {
        document.getElementById('clave').value = '';
        msg((r && r.mensaje) || 'No se pudo completar la solicitud.', true);
      }
    })
    .catch(function (e) {
      btn.disabled = false;
      btn.textContent = modoRegistro ? 'Crear cuenta' : 'Iniciar sesión';
      msg('Error de conexión: ' + (e.message || String(e)), true);
    });
});
</script>
</body>
</html>
